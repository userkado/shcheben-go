name: keep-alive

on:
  schedule:
    # 03:00-16:50 UTC = 08:00-21:50 Asia/Tashkent, every 10 minutes.
    - cron: "*/10 3-16 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          curl -sSf --max-time 150 --retry 3 --retry-delay 15 \
            https://shcheben-go.onrender.com/api/health
